services:
  db:
    image: postgres:18
    restart: unless-stopped
    container_name: db_crm
    environment:
      environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql

  api:
    build: ./backend
    container_name: api_crm
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}

    volumes:
      - ./backend:/app
      - /app/node_modules

  # web:
  #   build: ./frontend
  #   container_name: web_crm
  #   restart: unless-stopped
  #   ports:
  #     - "5173:5173"
  #   depends_on:
  #     - api
  #   volumes:
  #     - ./frontend:/app
  #     - /app/node_modules

volumes:
  pgdata:
